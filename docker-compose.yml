# CAE Viewer — Docker Compose
# VPS port: 8080

services:
  postgres:
    image: postgres:15-alpine
    container_name: caeviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caeviewer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-caedb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caeviewer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caeviewer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: caeviewer-app:latest
    container_name: caeviewer-app
    restart: unless-stopped
    ports:
      - "${CAE_PORT:-8080}:8080"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-caeviewer}:${DB_PASSWORD}@postgres/${DB_NAME:-caedb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/cae_viewer.log
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caeviewer-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    name: caeviewer_postgres_data
  uploads:
    name: caeviewer_uploads
  logs:
    name: caeviewer_logs

networks:
  caeviewer-net:
    driver: bridge
