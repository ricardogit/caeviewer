# CAE Viewer — Docker Compose
# VPS port: 8080

services:
  postgres:
    image: postgres:15-alpine
    container_name: caeviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caeviewer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-caedb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caeviewer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caeviewer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: caeviewer-app:latest
    container_name: caeviewer-app
    restart: unless-stopped
    ports:
      - "${CAE_PORT:-8080}:8080"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-caeviewer}:${DB_PASSWORD}@postgres/${DB_NAME:-caedb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/cae_viewer.log
    # app and workers are separate containers: everything under DATA_DIR (geometry, meshes,
    # experiments, topology/ROM/uncertainty results...) must be shared, not only these subfolders
    volumes: &shared_data
      - data:/app/data
      - uploads:/app/data/uploads
      - solver_data:/app/data/solver
      - design_data:/app/data/design
      - jobs_data:/app/data/jobs
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caeviewer-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Job workers (Postgres queue, SKIP LOCKED) ────────────────────────────
  # Solvers never run in the web process. Scale with:
  #   docker compose up -d --scale worker-solve=3
  worker-solve: &worker
    build:
      context: .
      dockerfile: docker/geometry.Dockerfile
    image: caeviewer-geometry:latest
    restart: unless-stopped
    user: "1001:1001"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-caeviewer}:${DB_PASSWORD}@postgres/${DB_NAME:-caedb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/worker.log
      - WORKER_QUEUES=default,solve
    volumes: *shared_data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caeviewer-net
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${SOLVE_WORKER_CPUS:-4}"
          memory: ${SOLVE_WORKER_MEM:-8g}

  worker-geometry:
    <<: *worker
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-caeviewer}:${DB_PASSWORD}@postgres/${DB_NAME:-caedb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/worker-geometry.log
      - WORKER_QUEUES=geometry,mesh
    deploy:
      resources:
        limits:
          cpus: "${GEOMETRY_WORKER_CPUS:-2}"
          memory: ${GEOMETRY_WORKER_MEM:-4g}

volumes:
  data:
    name: caeviewer_data
  postgres_data:
    name: caeviewer_postgres_data
  uploads:
    name: caeviewer_uploads
  logs:
    name: caeviewer_logs
  solver_data:
    name: caeviewer_solver_data
  design_data:
    name: caeviewer_design_data
  jobs_data:
    name: caeviewer_jobs_data

networks:
  caeviewer-net:
    driver: bridge
